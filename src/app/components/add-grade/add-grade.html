<div class="container mt-5" dir="rtl">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4 text-primary fw-bold">إضافة درجات الأسبوع</h3>

    <form (ngSubmit)="addWeekGrade()" #weekForm="ngForm">
      <div class="mb-3">
        <label for="student" class="form-label">اختر الطالب:</label>
        <select
          id="student"
          class="form-select"
          [(ngModel)]="selectedStudentId"
          name="student"
          required
        >
          <option value="" disabled selected>اختر الطالب</option>
          <option *ngFor="let student of students$ | async" [value]="student.id">
            {{ student.name }}
          </option>
        </select>
      </div>

      <div class="mb-3">
        <label for="week" class="form-label">رقم الأسبوع:</label>
        <input
          type="number"
          id="week"
          class="form-control"
          [(ngModel)]="weekNum"
          name="weekNum"
          min="1"
          max="36"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">درجة التقييم:</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="daraga"
          name="daraga"
          min="0"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">امتحان:</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="emthan"
          name="emthan"
          min="0"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">مواظبة:</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="mwazba"
          name="mwazba"
          min="0"
          required
        />
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-success w-50 me-2">إضافة</button>
        <button type="button" class="btn btn-outline-secondary w-50" (click)="goBack()">رجوع</button>
      </div>
    </form>

    <div *ngIf="message$ | async as message" class="alert alert-info mt-4 text-center">
      {{ message }}
    </div>
  </div>
</div>
